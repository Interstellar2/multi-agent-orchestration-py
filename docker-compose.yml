services:
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: hk-law-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: kibana:8.15.0
    container_name: hk-law-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # MCP Demo Server（金融数据版）
  # 提供 stdio / SSE 两种 transport，供 Agent 调用港交所金融数据 Mock 工具
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: multi-agent-mcp-server
    ports:
      - "18080:18080"
    environment:
      - TRANSPORT=sse
      - PORT=18080
    command: >
      python -m mcp_bridge.server.demo_server
      --transport sse
      --host 0.0.0.0
      --port 18080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18080/sse || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  es-data:
    driver: local
