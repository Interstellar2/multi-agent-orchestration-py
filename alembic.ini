[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 默认连接（会被 env.py 里的 get_url() 覆盖为 .env 中的 DATABASE_URL）
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/multi_agent

# migration 文件命名模板：{rev}_{slug}.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
